name: macOS Developer ID Release Gate

on:
  workflow_dispatch:

jobs:
  signed-notarized-bundle:
    name: Developer ID and Notarization
    runs-on: macos-26
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}

    steps:
      - name: Require Developer ID and notarization secrets
        shell: bash
        run: |
          missing=()
          for name in \
            APPLE_CERTIFICATE \
            APPLE_CERTIFICATE_PASSWORD \
            APPLE_ID \
            APPLE_PASSWORD \
            APPLE_SIGNING_IDENTITY \
            APPLE_TEAM_ID \
            KEYCHAIN_PASSWORD
          do
            if [[ -z "${!name}" ]]; then
              missing+=("$name")
            fi
          done
          if (( ${#missing[@]} )); then
            echo "Missing required secret names: ${missing[*]}" >&2
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Confirm Apple Silicon runner
        shell: bash
        run: test "$(uname -m)" = "arm64"

      - name: Setup pnpm
        uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: 24
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2.8.2
        with:
          workspaces: src-tauri -> target

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Import Developer ID certificate
        shell: bash
        run: |
          certificate="$RUNNER_TEMP/developer-id.p12"
          keychain="$RUNNER_TEMP/zero-gesture.keychain-db"
          echo "ZG_RELEASE_KEYCHAIN=$keychain" >> "$GITHUB_ENV"
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$certificate"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security default-keychain -s "$keychain"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security set-keychain-settings -t 3600 -u "$keychain"
          security import "$certificate" \
            -k "$keychain" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$keychain"
          security find-identity -v -p codesigning "$keychain" |
            grep -F "\"$APPLE_SIGNING_IDENTITY\""

      - name: Build, sign, notarize, and staple
        run: pnpm tauri build --bundles app,dmg --target aarch64-apple-darwin --ci

      - name: Validate packaged contract
        env:
          ZG_P04A_APP_BUNDLE: ${{ github.workspace }}/src-tauri/target/aarch64-apple-darwin/release/bundle/macos/Zero Gesture.app
        run: cargo test --manifest-path src-tauri/Cargo.toml --target aarch64-apple-darwin --test p04a_macos_packaging -- --test-threads=1

      - name: Validate Developer ID trust and notarization tickets
        shell: bash
        run: |
          app="src-tauri/target/aarch64-apple-darwin/release/bundle/macos/Zero Gesture.app"
          shopt -s nullglob
          dmgs=(src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg)
          test "${#dmgs[@]}" -eq 1
          dmg="${dmgs[0]}"
          codesign --verify --deep --strict --verbose=2 "$app"
          spctl --assess --type execute --verbose=4 "$app"
          codesign --verify --strict "$dmg"
          spctl --assess --type open --context context:primary-signature "$dmg"
          xcrun stapler validate "$app"
          xcrun stapler validate "$dmg"

      - name: Archive signed application bundle
        shell: bash
        run: ditto -c -k --sequesterRsrc --keepParent "src-tauri/target/aarch64-apple-darwin/release/bundle/macos/Zero Gesture.app" "$RUNNER_TEMP/zero-gesture-developer-id-macos-26-arm64.zip"

      - name: Upload signed and notarized artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: zero-gesture-developer-id-macos-26-arm64-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/zero-gesture-developer-id-macos-26-arm64.zip
            src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 14

      - name: Remove temporary keychain
        if: always()
        shell: bash
        run: |
          if [[ -n "${ZG_RELEASE_KEYCHAIN:-}" ]]; then
            security delete-keychain "$ZG_RELEASE_KEYCHAIN" || true
          fi
