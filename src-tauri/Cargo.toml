[package]
name = "zero-gesture"
version = "0.1.0"
description = "Zero Gesture desktop app"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "zero_gesture_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
installed-acceptance = []

[[test]]
name = "p05c_windows_installed"
path = "tests/p05c_windows_installed.rs"
required-features = ["installed-acceptance"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_path_to_error = "0.1"
crossbeam-channel = "0.5"
tauri-plugin-log = "2"
log = "0.4"
regex = "1"
tauri-plugin-dialog = "2"

[target.'cfg(windows)'.dependencies]
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
winreg = "0.10"

windows-sys = { version = "0.61", features = [
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Cryptography",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_HiDpi",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_DataExchange",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_IO",
    "Win32_System_LibraryLoader",
    "Win32_System_Pipes",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
    "Win32_System_SystemInformation",
    "Win32_Storage_FileSystem",
] }

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
objc2 = { version = "0.6.4", default-features = false }
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSColor", "NSFont", "NSFontDescriptor", "NSFontManager", "NSGraphics", "NSResponder", "NSRunningApplication", "NSScreen", "NSView", "NSWindow", "NSWorkspace", "libc", "objc2-core-foundation", "objc2-quartz-core"] }
objc2-application-services = { version = "0.3.2", default-features = false, features = ["AXError", "AXUIElement", "HIServices", "libc"] }
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["CFBase", "CFDate", "CFDictionary", "CFMachPort", "CFRunLoop", "CFString"] }
objc2-core-graphics = { version = "0.3.2", default-features = false, features = ["CGColor", "CGEvent", "CGEventTypes", "CGPath", "CGRemoteOperation"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["NSArray", "NSGeometry", "NSObject", "NSString", "objc2-core-foundation"] }
objc2-quartz-core = { version = "0.3.2", default-features = false, features = ["CALayer", "CAShapeLayer", "CATextLayer", "CATransaction", "objc2-core-foundation", "objc2-core-graphics"] }

[dev-dependencies]
tempfile = "3"
toml = "0.9"
